name: Test and publish images to Azure Container Registry

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  ACR_SERVER: ${{ vars.ACR_SERVER }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build client test image
        run: docker build -t react-test -f ./client/Dockerfile.dev ./client

      - name: Run client tests
        run: docker run --rm react-test npm test -- --coverage --watchAll=false

  publish:
    name: Publish images to ACR
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | \
            docker login "$ACR_SERVER" \
              --username "${{ secrets.ACR_USERNAME }}" \
              --password-stdin

      - name: Build and push client image
        run: |
          docker build \
            -f ./client/Dockerfile \
            -t "$ACR_SERVER/multi-client:${GITHUB_SHA}" \
            -t "$ACR_SERVER/multi-client:latest" \
            ./client
          docker push "$ACR_SERVER/multi-client:${GITHUB_SHA}"
          docker push "$ACR_SERVER/multi-client:latest"

      - name: Build and push Azure Nginx image
        run: |
          docker build \
            -f ./azure/Dockerfile.nginx \
            -t "$ACR_SERVER/multi-nginx:${GITHUB_SHA}" \
            -t "$ACR_SERVER/multi-nginx:latest" \
            ./azure
          docker push "$ACR_SERVER/multi-nginx:${GITHUB_SHA}"
          docker push "$ACR_SERVER/multi-nginx:latest"

      - name: Build and push server image
        run: |
          docker build \
            -f ./server/Dockerfile \
            -t "$ACR_SERVER/multi-server:${GITHUB_SHA}" \
            -t "$ACR_SERVER/multi-server:latest" \
            ./server
          docker push "$ACR_SERVER/multi-server:${GITHUB_SHA}"
          docker push "$ACR_SERVER/multi-server:latest"

      - name: Build and push worker image
        run: |
          docker build \
            -f ./worker/Dockerfile \
            -t "$ACR_SERVER/multi-worker:${GITHUB_SHA}" \
            -t "$ACR_SERVER/multi-worker:latest" \
            ./worker
          docker push "$ACR_SERVER/multi-worker:${GITHUB_SHA}"
          docker push "$ACR_SERVER/multi-worker:latest"

      - name: Sign out from ACR
        if: always()
        run: docker logout "$ACR_SERVER"
